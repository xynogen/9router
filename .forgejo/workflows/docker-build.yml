on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: forgejo.xynogen.xyz
          username: xynogen
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Tag current latest as previous
        run: |
          # Pull current latest and re-tag it as previous before building new latest
          docker pull forgejo.xynogen.xyz/xynogen/9router:latest || true
          if docker image inspect forgejo.xynogen.xyz/xynogen/9router:latest >/dev/null 2>&1; then
            docker tag forgejo.xynogen.xyz/xynogen/9router:latest forgejo.xynogen.xyz/xynogen/9router:previous
            docker push forgejo.xynogen.xyz/xynogen/9router:previous
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: forgejo.xynogen.xyz/xynogen/9router:latest
          cache-from: type=registry,ref=forgejo.xynogen.xyz/xynogen/9router:latest
          cache-to: type=inline
          provenance: false

      - name: Cleanup old tags
        run: |
          # Get all tags from the registry
          TAGS=$(curl -s -u xynogen:${{ secrets.REGISTRY_TOKEN }} \
            https://forgejo.xynogen.xyz/v2/xynogen/9router/tags/list | \
            grep -oP '(?<="tags":\[)[^\]]+' | tr -d '"' | tr ',' '\n')
          
          # Delete all tags except 'latest' and 'previous'
          for tag in $TAGS; do
            if [ "$tag" != "latest" ] && [ "$tag" != "previous" ]; then
              echo "Deleting tag: $tag"
              # Get the digest for the tag
              DIGEST=$(curl -s -u xynogen:${{ secrets.REGISTRY_TOKEN }} \
                -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                https://forgejo.xynogen.xyz/v2/xynogen/9router/manifests/$tag | \
                grep -oP '(?<="digest":")[^"]+' | head -1)
              
              # Delete the tag
              curl -X DELETE -u xynogen:${{ secrets.REGISTRY_TOKEN }} \
                https://forgejo.xynogen.xyz/v2/xynogen/9router/manifests/$DIGEST || true
            fi
          done
