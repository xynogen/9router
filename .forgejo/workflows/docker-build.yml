on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: forgejo.xynogen.xyz
          username: xynogen
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: actions/cache@v4
        with:
          path: /tmp/buildx-cache
          key: buildx-${{ hashFiles('package-lock.json', 'Dockerfile') }}
          restore-keys: buildx-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            forgejo.xynogen.xyz/xynogen/9router:latest
            forgejo.xynogen.xyz/xynogen/9router:${{ github.sha }}
          cache-from: type=local,src=/tmp/buildx-cache
          cache-to: type=local,dest=/tmp/buildx-cache-new,mode=min
          provenance: false

      - run: rm -rf /tmp/buildx-cache && mv /tmp/buildx-cache-new /tmp/buildx-cache
