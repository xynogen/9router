on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: forgejo.xynogen.xyz
          username: xynogen
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Tag current latest as previous
        run: |
          # Pull current latest and re-tag it as previous before building new latest
          docker pull forgejo.xynogen.xyz/xynogen/9router:latest || true
          if docker image inspect forgejo.xynogen.xyz/xynogen/9router:latest >/dev/null 2>&1; then
            docker tag forgejo.xynogen.xyz/xynogen/9router:latest forgejo.xynogen.xyz/xynogen/9router:previous
            docker push forgejo.xynogen.xyz/xynogen/9router:previous
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            forgejo.xynogen.xyz/xynogen/9router:latest
            forgejo.xynogen.xyz/xynogen/9router:${{ github.sha }}
          cache-from: type=registry,ref=forgejo.xynogen.xyz/xynogen/9router:latest
          cache-to: type=inline
          provenance: false

      - name: Cleanup old tags (keep last 30 days)
        run: |
          RETENTION_DAYS=30
          CUTOFF_DATE=$(date -d "$RETENTION_DAYS days ago" +%s)
          
          # Get all tags
          TAGS=$(curl -s -u xynogen:${{ secrets.REGISTRY_TOKEN }} \
            https://forgejo.xynogen.xyz/v2/xynogen/9router/tags/list | \
            grep -oP '(?<="tags":\[)[^\]]+' | tr -d '"' | tr ',' '\n')
          
          for tag in $TAGS; do
            # Skip 'latest' tag
            if [ "$tag" = "latest" ]; then
              continue
            fi
            
            # Get image creation date
            CREATED=$(curl -s -u xynogen:${{ secrets.REGISTRY_TOKEN }} \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              https://forgejo.xynogen.xyz/v2/xynogen/9router/manifests/$tag | \
              grep -oP '(?<="created":")[^"]+' | head -1)
            
            if [ -n "$CREATED" ]; then
              IMAGE_DATE=$(date -d "$CREATED" +%s 2>/dev/null || echo "0")
              
              if [ "$IMAGE_DATE" -lt "$CUTOFF_DATE" ] && [ "$IMAGE_DATE" != "0" ]; then
                echo "Deleting old tag: $tag (created: $CREATED)"
                
                DIGEST=$(curl -s -I -u xynogen:${{ secrets.REGISTRY_TOKEN }} \
                  -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                  https://forgejo.xynogen.xyz/v2/xynogen/9router/manifests/$tag | \
                  grep -i "Docker-Content-Digest:" | awk '{print $2}' | tr -d '\r')
                
                if [ -n "$DIGEST" ]; then
                  curl -X DELETE -u xynogen:${{ secrets.REGISTRY_TOKEN }} \
                    https://forgejo.xynogen.xyz/v2/xynogen/9router/manifests/$DIGEST || echo "Failed to delete $tag"
                fi
              else
                echo "Keeping tag: $tag (within retention period)"
              fi
            fi
          done
