on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v3

      - name: Login to Forgejo Registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login forgejo.xynogen.xyz \
            -u xynogen \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t forgejo.xynogen.xyz/xynogen/9router:latest \
            -t forgejo.xynogen.xyz/xynogen/9router:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push forgejo.xynogen.xyz/xynogen/9router:latest
          docker push forgejo.xynogen.xyz/xynogen/9router:${{ github.sha }}
