name: Build and Publish Container

on:
  push:
    tags: ["*"]

# A publish/prune run mutates the same registry package. Keep tag releases ordered
# so a newer run cannot prune images while an earlier build is still publishing.
concurrency:
  group: container-publish
  cancel-in-progress: false

# Forgejo currently ignores this GitHub-compatible key; it documents the
# least privilege expected if the workflow is ever run by GitHub Actions.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Derive version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME:-${FORGEJO_REF_NAME:-${CI_COMMIT_TAG}}}"
          [ -n "$VERSION" ] || { echo "No tag ref found"; exit 1; }
          echo "Derived version: $VERSION"
          OUTPUT_FILE="${FORGEJO_OUTPUT:-${GITHUB_OUTPUT:-}}"
          [ -n "$OUTPUT_FILE" ] || { echo "No Actions output file available"; exit 1; }
          echo "version=$VERSION" >> "$OUTPUT_FILE"

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.11.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: forgejo.xynogen.xyz
          username: xynogen
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            forgejo.xynogen.xyz/xynogen/9router:latest
            forgejo.xynogen.xyz/xynogen/9router:${{ steps.ver.outputs.version }}
          provenance: false
          no-cache: true

  prune:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Prune old package versions (keep latest 5)
        env:
          FORGEJO_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          FORGEJO_URL: https://forgejo.xynogen.xyz
          OWNER: xynogen
          PACKAGE: 9router
          KEEP: 5
        run: |
          # List all container versions for this package, sorted newest-first
          # API: GET /api/v1/packages/{owner}?type=container&q={name}&limit=50
          RESP=$(curl -sf \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${FORGEJO_URL}/api/v1/packages/${OWNER}?type=container&q=${PACKAGE}&limit=50")

          # Extract version strings sorted by created desc, skip "latest" (it's a moving tag)
          VERSIONS=$(echo "$RESP" \
            | jq -r 'sort_by(.created) | reverse | .[].version' \
            | grep -v '^latest$')

          TOTAL=$(echo "$VERSIONS" | grep -c .)
          echo "Found $TOTAL versioned entries, keeping ${KEEP}"

          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          TO_DELETE=$(echo "$VERSIONS" | tail -n "+$((KEEP + 1))")
          for VER in $TO_DELETE; do
            echo "Deleting ${PACKAGE}:${VER}"
            curl -sf -X DELETE \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              "${FORGEJO_URL}/api/v1/packages/${OWNER}/container/${PACKAGE}/${VER}" \
              && echo "  deleted ${VER}" || echo "  failed ${VER} (non-fatal)"
          done
