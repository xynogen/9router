on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: forgejo.xynogen.xyz
          username: xynogen
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Prepare cache directory
        run: |
          mkdir -p /cache/buildx
          ls -la /cache/buildx || echo "Cache empty (first run)"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            forgejo.xynogen.xyz/xynogen/9router:latest
            forgejo.xynogen.xyz/xynogen/9router:${{ github.sha }}
          cache-from: type=local,src=/cache/buildx
          cache-to: type=local,dest=/cache/buildx-new,mode=max
          provenance: false

      - name: Rotate cache
        run: |
          rm -rf /cache/buildx
          mv /cache/buildx-new /cache/buildx
