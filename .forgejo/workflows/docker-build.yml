on:
  push:
    tags: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: forgejo.xynogen.xyz
          username: xynogen
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: actions/cache@v4
        with:
          path: /tmp/buildx-cache
          key: buildx-${{ hashFiles('package-lock.json', 'package.json', 'Dockerfile', 'next.config.mjs', 'src/**', 'public/**') }}
          restore-keys: buildx-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            forgejo.xynogen.xyz/xynogen/9router:latest
            forgejo.xynogen.xyz/xynogen/9router:${{ steps.ver.outputs.version }}
          cache-from: type=local,src=/tmp/buildx-cache
          cache-to: type=local,dest=/tmp/buildx-cache-new,mode=min
          provenance: false

      - name: Cleanup buildx cache
        if: always()
        run: |
          rm -rf /tmp/buildx-cache
          if [ -d /tmp/buildx-cache-new ]; then
            mv /tmp/buildx-cache-new /tmp/buildx-cache
          else
            mkdir -p /tmp/buildx-cache
          fi
